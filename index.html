<!doctype html>
<html lang="en" data-theme="sage">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f4f7f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="My Finance" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/finance.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <style>
      html[data-theme='sage'] { background: #f4f7f6; color-scheme: light; }
      html[data-theme='ocean'] { background: #f2f6fa; color-scheme: light; }
      html[data-theme='dark'] { background: #111b24; color-scheme: dark; }
    </style>
    <script>
      // Apply the preference before styles or React render to avoid a theme flash.
      try {
        const theme = localStorage.getItem('my-finance-theme')
        if (['sage', 'ocean', 'dark'].includes(theme)) {
          document.documentElement.dataset.theme = theme
        }
      } catch {
        // Sage remains the default when browser storage is unavailable.
      }
      const startupTheme = document.documentElement.dataset.theme
      const startupColors = { sage: '#f4f7f6', ocean: '#f2f6fa', dark: '#111b24' }
      document.querySelector('meta[name="theme-color"]').content = startupColors[startupTheme]
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="My Finance — a personal finance tracker." />
    <title>My Finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
